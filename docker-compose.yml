version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bde_events_db
    restart: always
    environment:
      MYSQL_DATABASE: bde_events
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  api:
    build:
      context: ./backend
    container_name: bde_events_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bde_events
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

  react:
    build:
      context: ./frontend
    container_name: bde_events_react
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api